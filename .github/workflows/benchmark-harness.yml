name: Benchmark Harness

on:
  push:
  pull_request:

jobs:
  offline-tests:
    name: Offline runner and analysis tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install analysis dependencies
        run: python -m pip install -r hack/analyze/requirements.txt
      - name: Check shell syntax and offline behavior
        run: |
          command -v jq
          bash -n hack/run_calibration.sh
          python -m unittest discover -s hack/tests -p 'test_*.py'
          python -m unittest discover -s hack/analyze -p 'test_*.py'
          bash hack/run_calibration.sh --dry-run
          bash hack/run_matrix.sh --dry-run
