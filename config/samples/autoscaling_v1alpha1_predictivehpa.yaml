apiVersion: autoscaling.brian.io/v1alpha1
kind: PredictiveHPA
metadata:
  name: predictivehpa-sample
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: php-apache
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50
  decisionMode: Predictive  # Predictive（默认）/ Current / Hybrid
  prediction:
    algorithm: EWMA
    alphaPercent: 30        # alpha = 0.3
    window: 5m              # EWMA 用 5 分钟历史窗口
    horizon: 30s            # 预测 30 秒后的值
  scaleDownStabilizationWindowSeconds: 60
