# This rule is not used by the project predictive-hpa itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the autoscaling.brian.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: predictive-hpa
    app.kubernetes.io/managed-by: kustomize
  name: predictivehpa-editor-role
rules:
- apiGroups:
  - autoscaling.brian.io
  resources:
  - predictivehpas
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - autoscaling.brian.io
  resources:
  - predictivehpas/status
  verbs:
  - get
