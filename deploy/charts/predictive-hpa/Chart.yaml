apiVersion: v2
name: predictive-hpa
description: 基于 EWMA 时序预测的 Kubernetes 自定义 HPA 控制器
type: application

# chart 自身版本（每次 chart 模板变更递增）
version: 0.3.0

# 底层控制器镜像版本（与 git tag / 镜像 tag 对齐）
appVersion: "0.1.0"

# CRD 依赖 CEL 及自 Kubernetes 1.33 稳定的 validation ratcheting；实测为 1.35
kubeVersion: ">=1.33.0-0"

keywords:
  - autoscaling
  - hpa
  - predictive
  - ewma
  - kubernetes-operator

home: https://github.com/th1nking/predictive-hpa
sources:
  - https://github.com/th1nking/predictive-hpa

maintainers:
  - name: th1nking
